name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows because the client is WPF and the audio tests exercise the Windows build.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build, test, and publish
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-win-x64
          path: artifacts/*.zip
